name: Popular sync

# Standalone trigger for the Kaikansen API's popular-flags sync.
# Split out of theme-sync.yml so the popular rail can be refreshed
# on its own: the popular pass only matches themes already in the
# database against the editorial list — it does not need the
# AnimeThemes API, so it can run even while the themes sync cannot.
# All calls are gated by the SYNC_SECRET repo secret (header
# `x-sync-secret`), which must match the API's SYNC_SECRET env var.
# No secret values live in this file.

on:
  workflow_dispatch:

env:
  API_BASE: https://kaikansen-api.onrender.com

jobs:
  popular:
    name: Sync popular flags
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Trigger popular sync
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -f -sS --max-time 300 -X POST "$API_BASE/internal/sync/popular" \
                 -H "x-sync-secret: $SYNC_SECRET" \
                 -H "Content-Type: application/json" \
                 -d "{}"; then
              echo
              echo "Popular sync accepted"
              exit 0
            fi
            echo "Trigger attempt $attempt failed — retrying in 30s"
            sleep 30
          done
          echo "Could not trigger the popular sync"
          exit 1

      - name: Wait for popular sync
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          for i in $(seq 1 30); do
            body="$(curl -sS --max-time 120 -H "x-sync-secret: $SYNC_SECRET" "$API_BASE/internal/sync/status" || true)"
            state="$(printf '%s' "$body" | jq -r '.state // "unknown"' 2>/dev/null || echo unknown)"
            echo "poll $i: state=$state"
            printf '%s\n' "$body"
            case "$state" in
              completed) exit 0 ;;
              failed) echo "Popular sync job failed"; exit 1 ;;
            esac
            sleep 120
          done
          echo "Timed out waiting for the popular sync"
          exit 1
