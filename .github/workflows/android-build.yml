name: Android APK (EAS local build)

# Manual APK build that bypasses the EAS *cloud* build quota: the
# build runs on GitHub's runner via `eas build --local`, with the
# signing credentials fetched from EAS using the EXPO_TOKEN repo
# secret — so the APK is signed with the same keystore as the EAS
# cloud builds (SHA-256 98:95:A6:28:...:66:8A) and installs over
# them with no uninstall. The APK is saved as a run artifact and
# attached to the rolling `apk-latest` prerelease for a direct
# download link.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Run #16 died of runner "Disk quota exceeded" mid-Gradle, so
      # free space BEFORE anything is installed. This step must stay
      # above the installs: an earlier version of it ran after
      # "Install EAS CLI" and deleted $AGENT_TOOLSDIRECTORY, which is
      # where npm's global eas-cli lives — the build then died with
      # "eas: command not found" (runs #20/#21). The tool cache is
      # never deleted; only unrelated preinstalled weight goes.
      - name: Free disk space for the build
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          docker system prune -af || true
          df -h

      - name: Install dependencies
        run: npm ci

      # packages/contracts ships only sources; its main entry
      # dist/index.js is gitignored build output. Metro must resolve
      # @kaikansen/contracts when bundling the app, so build it here
      # before EAS runs — without this the bundle step fails with
      # "Unable to resolve @kaikansen/contracts".
      - name: Build shared contracts
        run: npm run build -w @kaikansen/contracts

      - name: Install EAS CLI
        run: npm install --global eas-cli

      # TMPDIR is deliberately NOT overridden here: an earlier attempt
      # pointed it at $GITHUB_WORKSPACE/.eas-tmp, which sits inside
      # the project directory, so EAS's copy of the project into its
      # shallow-clone dir became a copy into a subdirectory of
      # itself and cp refused (EINVAL, runs #22/#23). The default
      # /tmp worked for runs #13–#15; the relocated free-disk step
      # above is the real cure for run #16's quota failure.
      - name: Build APK (preview profile, local)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --profile preview --platform android --local --non-interactive --output "$GITHUB_WORKSPACE/kaikansen.apk"

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaikansen-apk
          path: kaikansen.apk
          if-no-files-found: error

      - name: Attach to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --title "Kaikansen Android — latest Actions build" --notes "Rolling APK built by GitHub Actions (eas build --local, preview profile). Signed with the EAS keystore; installs over the EAS builds."
          gh release upload apk-latest kaikansen.apk --clobber
